name: Main workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron:  '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - '26.3'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: working
          key: ${{ runner.os }}-working
      - uses: actions/setup-python@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - uses: conao3/setup-cask@v1.1

      - name: Build
        run: |
          git status
          # make add-package-build-remote
          # make pull-package-build
          make

      - name: Install SSH key
        if: github.ref == 'refs/heads/master'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        run: |
          rsync -av -e 'ssh' --delete --exclude=.git --exclude=working ./ conao3@conao3.sakura.ne.jp::www/celpa/
